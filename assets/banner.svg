<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#grid-fade)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 1000px 160px; }
    .animated-float { animation: float 6s ease-in-out infinite; }
    .animated-chart { stroke-dasharray: 8, 4; animation: dash 20s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Background Dynamic Graphic Elements (Low opacity, strictly background) -->
  <g class="animated-pulse" opacity="0.4">
    <circle cx="1020" cy="160" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="1020" cy="160" r="90" fill="#a855f7" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Dynamic Background Trend Lines & Chart Bars -->
  <g opacity="0.25">
    <rect x="820" y="180" width="24" height="80" rx="4" fill="#6366f1" />
    <rect x="855" y="150" width="24" height="110" rx="4" fill="#818cf8" />
    <rect x="890" y="130" width="24" height="130" rx="4" fill="#a855f7" />
    <rect x="925" y="100" width="24" height="160" rx="4" fill="#c084fc" />
    <rect x="960" y="70" width="24" height="190" rx="4" fill="#ec4899" />
    <path d="M 800 210 Q 870 170 910 120 T 1000 50" fill="none" stroke="#f472b6" stroke-width="4" class="animated-chart" />
  </g>

  <!-- Dynamic Decorative Floating Pills (Background Accent) -->
  <g class="animated-float" opacity="0.6">
    <rect x="750" y="50" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="830" y="73" text-anchor="middle" class="badge-text">🏢 CRE Analytics</text>

    <rect x="930" y="240" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="1020" y="263" text-anchor="middle" class="badge-text">📊 DCF & Mass AVM</text>
  </g>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)" />

  <!-- FOREGROUND CONTENT (Always readable, foreground layer) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <rect x="0" y="55" width="260" height="30" rx="15" fill="url(#accent)" opacity="0.9" />
    <text x="130" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1.5">AWESOME CRE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Commercial Property Valuation 🏢</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated SaaS Platforms, DCF Engines, Mass Appraisal &amp; AI Agent Skills</text>

    <!-- Highlights Pill List -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="22" text-anchor="middle" class="badge-text">💼 Institutional SaaS</text>

      <!-- Pill 2 -->
      <rect x="162" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="244" y="22" text-anchor="middle" class="badge-text">⚡ Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="339" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="411" y="22" text-anchor="middle" class="badge-text">🤖 AI Underwriting</text>
    </g>
  </g>
</svg>
